<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>💎 ERC20 Transfer 💎</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap');
    body {
      margin: 0;
      font-family: 'Fredoka', sans-serif;
      /* Main background: very light baby blue */
      background-color: #f0f9ff;
      /* Grid line color: light baby blue */
      background-image:
        linear-gradient(#e0f2fe 1px, transparent 1px),
        linear-gradient(90deg, #e0f2fe 1px, transparent 1px);
      background-size: 20px 20px;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 20px;
      /* Outer border: light-to-medium blue */
      border: 4px solid #7dd3fc;
      /* Shadow color: same light-to-medium blue */
      box-shadow: 8px 8px 0px #7dd3fc;
      text-align: center;
      width: 380px;
    }
    h2 {
      margin: 0 0 10px 0;
      font-size: 24px;
      /* Title color: darker, contrasting blue */
      color: #0c4a6e;
    }
    .subtitle {
      font-size: 13px;
      /* Subtitle color: medium blue */
      color: #0284c7;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .info-box {
      /* Inner box background: extremely light blue */
      background: #f7fee7;
      /* Box border color: light, pale blue */
      border: 3px dashed #93c5fd;
      border-radius: 14px;
      padding: 12px 15px;
      margin-bottom: 16px;
      text-align: left;
      font-size: 13px;
      /* Inner text color: dark, slightly "teal-tinted" blue */
      color: #0f172a;
    }
    .info-box .row {
      margin-bottom: 6px;
    }
    .info-box .row:last-child {
      margin-bottom: 0;
    }
    .info-label {
      font-weight: 700;
      /* Inner labels color: medium blue */
      color: #0369a1;
    }
    .info-value {
      word-break: break-all;
    }
    button {
      /* Non-hover state background: very light cyan/blue */
      background: #e0f2fe;
      /* Text color: a darker blue */
      color: #0369a1;
      border: 3px solid #0369a1;
      padding: 14px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      box-shadow: 0px 5px 0px #0369a1;
      transition: 0.1s ease;
    }
    button:hover {
      /* Hover background: very close to white/super light cyan */
      background: #f0f9ff;
      transform: translateY(-2px);
    }
    button:active {
      transform: translateY(3px);
      box-shadow: 0px 0px 0px #0369a1;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: 0px 5px 0px #0369a1;
    }
    #output {
      margin-top: 20px;
      padding: 15px;
      background: #f7fee7;
      border: 3px dashed #93c5fd;
      border-radius: 14px;
      font-size: 14px;
      color: #0f172a;
      word-break: break-all;
      min-height: 20px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Token Send! 💙</h2>
    <div class="subtitle">ERC-20 Transfer (Sepolia)</div>

    <div class="info-box">
      <div class="row">
        <span class="info-label">To: </span>
        <span class="info-value">0x15433DA387451F9dE4565280C85506CB71aF9376</span>
      </div>
      <div class="row">
        <span class="info-label">Amount: </span>
        <span class="info-value">10 WLT</span>
      </div>
    </div>

    <button id="btn">Send 10 WLT 💎</button>
    <div id="output">Click to send tokens!</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
  <script>
    const TOKEN_ADDRESS = "0xb1f4c6d12325501f67830262d58f2053839ea6c8";
    const RECIPIENT     = "0x15433DA387451F9dE4565280C85506CB71aF9376";
    const AMOUNT        = 10; // whole tokens

    const ABI = [
      "function transfer(address to, uint256 amount) returns (bool)",
      "function decimals() view returns (uint8)"
    ];

    const btn    = document.getElementById("btn");
    const output = document.getElementById("output");

    btn.onclick = async () => {
      try {
        if (!window.ethereum) {
          output.innerText = "❌ MetaMask not installed";
          return;
        }

        btn.disabled = true;
        output.innerText = "⏳ Connecting wallet...";

        // Connect wallet
        await window.ethereum.request({ method: "eth_requestAccounts" });
        const provider = new ethers.BrowserProvider(window.ethereum);
        const signer   = await provider.getSigner();

        output.innerText = "⏳ Preparing transaction...";

        // Set up contract with signer
        const contract = new ethers.Contract(TOKEN_ADDRESS, ABI, signer);

        // Get decimals to compute the correct raw amount
        const decimals  = await contract.decimals();
        const rawAmount = ethers.parseUnits(AMOUNT.toString(), decimals);

        output.innerText = "⏳ Waiting for MetaMask confirmation...";

        // Submit the transfer() transaction
        const tx = await contract.transfer(RECIPIENT, rawAmount);

        output.innerText = "⏳ Transaction sent! Waiting for confirmation...\n\n🔗 Tx Hash:\n" + tx.hash;

        // Wait for 1 block confirmation
        const receipt = await tx.wait(1);

        output.innerText =
          "✅ Transfer confirmed!\n\n" +
          "💸 Sent: " + AMOUNT + " WLT\n" +
          "👛 To: " + RECIPIENT + "\n\n" +
          "🔗 Tx Hash:\n" + receipt.hash + "\n\n" +
          "📦 Block: " + receipt.blockNumber;

      } catch (err) {
        console.error(err);
        output.innerText =
          "❌ Error:\n" + (err?.shortMessage || err?.message || JSON.stringify(err));
      } finally {
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
