<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>🔮 ERC20 Balance Checker 🔮</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap');

    body {
      margin: 0;
      font-family: 'Fredoka', sans-serif;
      background-color: #f3e8ff;
      background-image:
        linear-gradient(#e9d5ff 1px, transparent 1px),
        linear-gradient(90deg, #e9d5ff 1px, transparent 1px);
      background-size: 20px 20px;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 20px;
      border: 4px solid #a855f7;
      box-shadow: 8px 8px 0px #a855f7;
      text-align: center;
      width: 380px;
    }

    h2 {
      margin: 0 0 10px 0;
      font-size: 24px;
      color: #7e22ce;
    }

    .subtitle {
      font-size: 13px;
      color: #a855f7;
      font-weight: 600;
      margin-bottom: 20px;
    }

    button {
      background: #e9d5ff;
      color: #7e22ce;
      border: 3px solid #7e22ce;
      padding: 14px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      box-shadow: 0px 5px 0px #7e22ce;
      transition: 0.1s ease;
    }

    button:hover {
      background: #f3e8ff;
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(3px);
      box-shadow: 0px 0px 0px #7e22ce;
    }

    #output {
      margin-top: 20px;
      padding: 15px;
      background: #faf5ff;
      border: 3px dashed #d8b4fe;
      border-radius: 14px;
      font-size: 14px;
      color: #6b21a8;
      word-break: break-all;
      min-height: 20px;
      white-space: pre-wrap;
    }

    .addr {
      font-weight: 700;
      color: #7e22ce;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>Token Check! 🔮</h2>
    <div class="subtitle">ERC-20 Balance Checker (Sepolia)</div>

    <button id="btn">Check My Balance ✨</button>

    <div id="output">Click to check your balance 💕</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>

  <script>
    const TOKEN_ADDRESS = "0xfee57c81a5716f7baa96ee5d7e8daa00072657b197c3609210feea8bd9335330";

    const ABI = [
      "function balanceOf(address owner) view returns (uint256)",
      "function decimals() view returns (uint8)",
      "function symbol() view returns (string)"
    ];

    const btn = document.getElementById("btn");
    const output = document.getElementById("output");

    btn.onclick = async () => {
      try {
        if (!window.ethereum) {
          output.innerText = "MetaMask not installed";
          return;
        }

        // Connect wallet
        await window.ethereum.request({ method: "eth_requestAccounts" });

        // Provider + signer
        const provider = new ethers.BrowserProvider(window.ethereum);
        const signer = await provider.getSigner();

        const userAddress = await signer.getAddress();

        // Contract MUST use signer in ethers v6
        const contract = new ethers.Contract(TOKEN_ADDRESS, ABI, signer);

        // Call contract
        const balance = await contract.balanceOf(userAddress);
        const decimals = await contract.decimals();
        const symbol = await contract.symbol();

        const formatted = ethers.formatUnits(balance, decimals);

        output.innerText =
          "👛 Address:\n" + userAddress +
          "\n\n💰 Balance:\n" + formatted + " " + symbol;

      } catch (err) {
        console.error(err);
        output.innerText =
          "❌ Error:\n" + (err?.shortMessage || err?.message || JSON.stringify(err));
      }
    };
  </script>
</body>
</html>
