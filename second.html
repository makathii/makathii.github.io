<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>🔮 ERC20 Balance Checker 🔮</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap');

    body {
      margin: 0;
      font-family: 'Fredoka', 'Arial Rounded MT Bold', sans-serif;
      background-color: #f3e8ff; 
      background-image: 
        linear-gradient(#e9d5ff 1px, transparent 1px),
        linear-gradient(90deg, #e9d5ff 1px, transparent 1px);
      background-size: 20px 20px;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 20px;
      border: 4px solid #a855f7;
      box-shadow: 8px 8px 0px #a855f7; 
      text-align: center;
      width: 360px;
    }

    h2 {
      margin: 0 0 10px 0;
      font-size: 24px;
      color: #7e22ce;
      text-shadow: 1px 1px 0px #f3e8ff;
    }

    .subtitle {
      font-size: 13px;
      color: #a855f7;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 20px;
    }

    button {
      background: #e9d5ff;
      color: #7e22ce;
      border: 3px solid #7e22ce;
      padding: 14px 18px;
      border-radius: 14px;
      font-family: 'Fredoka', sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      box-shadow: 0px 5px 0px #7e22ce;
      transition: all 0.1s ease;
    }

    button:hover {
      background: #f3e8ff;
      transform: translateY(-2px);
      box-shadow: 0px 7px 0px #7e22ce;
    }

    button:active {
      transform: translateY(5px);
      box-shadow: 0px 0px 0px #7e22ce;
    }

    #output {
      margin-top: 25px;
      padding: 15px;
      background: #faf5ff;
      border: 3px dashed #d8b4fe;
      border-radius: 14px;
      font-size: 14px;
      color: #6b21a8;
      font-weight: 500;
      line-height: 1.5;
      word-break: break-all; 
      min-height: 20px;
    }

    .address-highlight {
      font-weight: 700;
      color: #a855f7;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>Token Check! 🔮</h2>
    <div class="subtitle">🎀 ERC-20 Balance Checker 🎀</div>

    <button id="btn">Check My Balance ✨</button>

    <div id="output">Click to check your balance 💕</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>

  <script>
    
    const TOKEN_ADDRESS = "0xfee57c81a5716f7baa96ee5d7e8daa00072657b197c3609210feea8bd9335330";

    const ABI = [
      "function balanceOf(address owner) view returns (uint256)",
      "function decimals() view returns (uint8)",
      "function symbol() view returns (string)"
    ];

    const btn = document.getElementById("btn");
    const output = document.getElementById("output");

    btn.onclick = async () => {
      try {
        if (!window.ethereum) {
          output.innerHTML = "MetaMask not installed";
          return;
        }

        await window.ethereum.request({ method: "eth_requestAccounts" });

        const provider = new ethers.BrowserProvider(window.ethereum);
        const signer = await provider.getSigner();

        const userAddress = await signer.getAddress();

        const contract = new ethers.Contract(TOKEN_ADDRESS, ABI, provider);

        const [balance, decimals, symbol] = await Promise.all([
          contract.balanceOf(userAddress),
          contract.decimals(),
          contract.symbol()
        ]);

        const formatted = ethers.formatUnits(balance, decimals);

        output.innerHTML =
          "👛 <span class='address-highlight'>Address:</span><br>" + userAddress +
          "<br><br>✨ <span class='address-highlight'>Balance:</span><br>" + formatted + " " + symbol;

      } catch (err) {
        console.error(err);
        output.innerHTML = "😿 Error fetching balance";
      }
    };
  </script>
</body>
</html>
