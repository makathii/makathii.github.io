<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>🌸 Sepolia Block Height 🌸</title>

  <style>
    /* Import a cute, playful font */
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap');

    body {
      margin: 0;
      font-family: 'Fredoka', 'Arial Rounded MT Bold', sans-serif;
      background-color: #ffe4e6;
      /* Grid pattern for that retro blocky feel */
      background-image: 
        linear-gradient(#ffd1d7 1px, transparent 1px),
        linear-gradient(90deg, #ffd1d7 1px, transparent 1px);
      background-size: 20px 20px;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Blocky, high-contrast container */
    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 20px;
      border: 4px solid #ff7b90;
      /* Hard, pixel/block-style shadow */
      box-shadow: 8px 8px 0px #ff7b90;
      text-align: center;
      width: 340px;
    }

    h2 {
      margin: 0 0 10px 0;
      font-size: 26px;
      color: #ff5271;
      text-shadow: 1px 1px 0px #ffe4e6;
    }

    .label {
      font-size: 14px;
      color: #ff7b90;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 20px;
    }

    /* Cute blocky button */
    button {
      background: #ffb3c1;
      color: #ff5271;
      border: 3px solid #ff5271;
      padding: 14px 18px;
      border-radius: 14px;
      font-family: 'Fredoka', sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      box-shadow: 0px 5px 0px #ff5271;
      transition: all 0.1s ease;
    }

    button:hover {
      background: #ffc2cd;
      transform: translateY(-2px);
      box-shadow: 0px 7px 0px #ff5271;
    }

    button:active {
      transform: translateY(5px);
      box-shadow: 0px 0px 0px #ff5271;
    }

    /* Output box matching the theme */
    #output {
      margin-top: 25px;
      margin-bottom: 0;
      padding: 15px;
      background: #fff5f6;
      border: 3px dashed #ffb3c1;
      border-radius: 14px;
      font-size: 15px;
      color: #ff5271;
      font-weight: 600;
      min-height: 20px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>Sepolia Testnet ✨</h2>
    <div class="label">🎀 Block Height Viewer 🎀</div>

    <button id="btn">Get Block Number ✨</button>

    <p id="output">Click the button to fetch block number 💕</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>

  <script>
    const btn = document.getElementById("btn");
    const output = document.getElementById("output");

    btn.onclick = async () => {
      try {
        if (!window.ethereum) {
          output.innerText = "❌ MetaMask not installed";
          return;
        }

        await window.ethereum.request({ method: "eth_requestAccounts" });

        const provider = new ethers.BrowserProvider(window.ethereum);

        const network = await provider.getNetwork();
        if (network.chainId !== 11155111n) {
          output.innerText = "🌸 Please switch MetaMask to Sepolia!";
          return;
        }

        const blockNumber = await provider.getBlockNumber();
        output.innerText = "💖 Current Sepolia block: " + blockNumber;

      } catch (e) {
        console.error(e);
        output.innerText = "😿 Error fetching block number";
      }
    };
  </script>
</body>
</html>
